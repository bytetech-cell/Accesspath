<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Checkout – ShopEasy</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="logo" href="index.html">ShopEasy</a>
<input class="search" type="search" placeholder="Search products...">
<a class="cart-link" href="cart.html" id="cartLink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></a></header>
<div class="layout"><main id="main">
<h1>Checkout</h1><div class="card"><p>Review your order. (Demo site — no payment is taken.)</p>
<button class="btn" type="button" onclick="this.textContent='Order placed ✓'">Place order</button></div>
</main></div><script>
function getCart(){try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){return []}}
function setCart(c){localStorage.setItem('cart',JSON.stringify(c));updateCount()}
function updateCount(){var el=document.getElementById('cartCount');if(el)el.textContent=getCart().length;
 var l=document.getElementById('cartLink'); if(l && l.hasAttribute('aria-label')) l.setAttribute('aria-label','Cart, '+getCart().length+' items');}
updateCount();
</script></body></html>
